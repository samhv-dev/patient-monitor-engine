<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FU-4: emergent arrest, obstructive shock, hyperkalaemia, CPR</title>
  <style>
    body { margin: 0; background: #000; color: #ddd; font: 13px system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }
    #monitor { min-height: 0; height: 100vh; }
    aside { padding: 8px 10px; overflow: auto; border-left: 1px solid #333; }
    fieldset { border: 1px solid #333; margin: 0 0 6px; padding: 4px 8px; }
    legend { color: #888; }
    button, select { margin: 2px; font: inherit; }
    #truth { font: 12px ui-monospace, monospace; color: #9cf; white-space: pre; margin: 4px 0 8px; }
    #log { white-space: pre; font: 11px ui-monospace, monospace; color: #8f8; }
  </style>
</head>
<body>
  <div id="monitor"></div>
  <aside>
    <div id="truth"></div>
    <fieldset><legend>Scenario (restarts the patient, MODELED, ETT + VCV 12 × 600)</legend>
      <button id="induction">1 Healthy induction (propofol 2 mg/kg)</button>
      <button id="tamponade">2 Tamponade → propofol 2 mg/kg (Ali)</button>
      <button id="bleed">3 Class IV haemorrhage → PEA</button>
      <button id="ptx">4 Tension pneumothorax (one command)</button>
      <button id="burns">5 Burns + succinylcholine</button>
      <button id="vf">6 VF + CPR (quality 1)</button>
      <button id="pe">7 Massive PE → propofol</button>
    </fieldset>
    <fieldset><legend>Resuscitation</legend>
      <button id="resus">CPR + 2 L + adrenaline 1 mg</button><button id="cprOff">Stop CPR</button>
    </fieldset>
    <fieldset><legend>Speed</legend>
      <select id="speed"><option value="1">×1</option><option value="2">×2</option><option value="4" selected>×4</option></select>
    </fieldset>
    <div id="log"></div>
  </aside>
  <script type="module" src="./src/fu4.ts"></script>
</body>
</html>
