# DIAGNOSTIC (brief 233, reused by brief 235; branch diag-233-vent-knob-webkit only, never merged): vent-edp-ts.e2e.ts:117 on CI's WebKit
# (the WPE port in the Playwright image), retries off, a trace of every attempt, and a probe that logs each step's state
# and every input event the page received. One job, one worker.
name: diag-233
on:
  push:
    branches: [diag-233-vent-knob-webkit]
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --ulimit core=0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: brief 235, leftover pages on purpose (zz-diag-235), WebKit and Chromium, retries off
        run: |
          set +e
          pnpm exec playwright test --project=webkit --project=chromium --workers=1 --retries=0 --reporter=list apps/demo/e2e/zz-diag-235.e2e.ts; echo "diag235 exit $?"
          exit 0
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diag-233
          path: |
            test-results/
            test-results-probe/
          if-no-files-found: warn
