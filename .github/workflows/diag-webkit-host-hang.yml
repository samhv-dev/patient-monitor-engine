name: diag-webkit-host-hang

# DIAGNOSTIC ONLY (brief 203, branch diag-webkit-host-hang, never merged). The two specs whose host page stopped answering
# on CI WebKit (run 43151492170, e2e-evidence-webkit-2of3), repeated in CI's own container with retries 0 and the host
# page instrumented (apps/demo/e2e/diag-host.ts, PME_DIAG_HOST=1). Every repetition's host record is uploaded, failed or
# passed, so the failing ones can be compared with the passing ones.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diag-webkit-host-hang-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  version:
    if: github.head_ref == 'diag-webkit-host-hang'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Run 43181312372: the crash sites as offsets from libWPEWebKit's .text start (gdb's "From"); the nearest exported
  # symbols at and before them, and the code around them (the library is stripped of its own symbol table)
  symbols:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
    steps:
      - run: |
          apt-get update -qq && apt-get install -y -qq binutils python3 > /dev/null
          L=$(ls /ms-playwright/webkit-*/minibrowser-wpe/lib/libWPEWebKit-2.0.so.1); ls -l $L; readelf -S -W $L | grep -E ' \.text|\.rodata|\.dynsym|\.symtab'
          T=$(readelf -S -W $L | awk '$2==".text"{print $4}')
          nm -D --defined-only $L | sort > /tmp/dyn.txt; wc -l /tmp/dyn.txt
          nm --defined-only $L 2>&1 | head -2
          for o in 0x592439d 0x5924476 0x5928253 0x5921547 0x59226c2 0x5924b68 0x59a82f7 0x5afbea8 0x5919a6e 0x5918bea 0x59236c3 0x590dbc9 0x5910873; do
            a=$(printf '%x' $((0x$T + o)))
            echo "== text+$o = 0x$a"
            python3 -c "import sys;a=int('$a',16);best=None
          for l in open('/tmp/dyn.txt'):
              p=l.split(None,2)
              if len(p)<3: continue
              v=int(p[0],16)
              if v<=a and (best is None or v>best[0]): best=(v,p[2].strip())
          print('   nearest dynamic symbol before: %s +0x%x'%(best[1][:200],a-best[0]) if best else '   none')"
            objdump -d -C --no-show-raw-insn --start-address=0x$(printf '%x' $((0x$a - 48))) --stop-address=0x$(printf '%x' $((0x$a + 4))) $L | tail -14
          done
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
        # worker: the host as the product runs it (its monitor in an OffscreenCanvas worker); main: the same host with
        # transferControlToOffscreen removed, so its monitor runs on the page's main thread (diag-host.ts)
        variant: [worker, main]
    name: diag webkit ${{ matrix.variant }} (${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
      options: --ipc=host --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: nproc and memory; gdb for the thread dumps of a stuck WebKit process (apps/demo/e2e/diag-host.ts)
        run: |
          nproc; free -m
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"; echo "ulimit -c: $(ulimit -c)"
          apt-get update -qq && apt-get install -y -qq gdb > /dev/null && gdb --version | head -1
        timeout-minutes: 5
      - id: e2e
        name: the two specs, repeated (retries 0, one worker as ci.yml's WebKit)
        run: pnpm test:e2e --project=webkit --repeat-each="$REPEAT" --retries=0 --reporter=list,json --grep "a phone picks Depth of anaesthesia" apps/demo/e2e/depth-window.e2e.ts
        env:
          CI: '1'
          PME_DIAG_HOST: '1'
          DEBUG: 'pw:browser' # the browser processes' own stderr in this log (a WebKit assertion or crash message)
          REPEAT: '12'
          PME_DIAG_NO_OFFSCREEN: ${{ matrix.variant == 'main' && '1' || '0' }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report-diag.json
      - name: repetitions passed and failed
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: node scripts/ci/e2e-report.mjs quarantine playwright-report-diag.json | cut -f1 | sort | uniq -c || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: diag-webkit-host-hang-${{ matrix.variant }}-${{ matrix.part }}-${{ github.run_attempt }}
          path: |
            playwright-report-diag.json
            test-results/**/diag/**
            test-results/**/trace.zip
            test-results/**/evidence/**
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
