name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: slow groups are disjoint and cover SLOW (FU-9 CI amendment 5; FU-7 gate adds slow-e and slow-f; CI amendment 6 adds slow-g)
        working-directory: packages/engine-core
        run: |
          for g in slow slow-a slow-b slow-c slow-d slow-e slow-f slow-g; do PME_TEST_SET=$g pnpm exec vitest list --filesOnly | sort > "$RUNNER_TEMP/$g.txt"; echo "$g: $(wc -l < "$RUNNER_TEMP/$g.txt") files"; done
          cd "$RUNNER_TEMP"
          sort slow-a.txt slow-b.txt slow-c.txt slow-d.txt slow-e.txt slow-f.txt slow-g.txt | uniq -d > both.txt
          if [ -s both.txt ]; then echo "in two slow groups:"; cat both.txt; exit 1; fi
          sort -u slow-a.txt slow-b.txt slow-c.txt slow-d.txt slow-e.txt slow-f.txt slow-g.txt | diff slow.txt -
      - run: pnpm test
        env:
          PME_TEST_SET: fast # the slow engine set runs in the test-slow job
      - run: pnpm build
      - run: pnpm check-notices

  # fix-ci-webkit-3: the renderer IIFE is built once, here, and shared: the e2e jobs need only it (iife-smoke.html loads
  # it from file://; every other e2e page runs on a Vite dev server from source), so they start without waiting for the
  # unit tests in the build job.
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pme/renderer build
      - uses: actions/upload-artifact@v4
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist/patient-monitor.iife.js
          if-no-files-found: error

  # fix-ci-webkit-3: one e2e job per browser (was one step running both on one 2-vCPU runner, so each browser's
  # wall-clock-sensitive tests ran beside the other's load). Retries stay at 2 (playwright.config.ts, CI).
  e2e:
    needs: renderer
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # FX-1 TEMPORARY diagnostic (reverted in the next commit): only the Ventilator-view files, no retries
      - run: pnpm test:e2e --project=${{ matrix.browser }} --reporter=list,json --retries=0 --repeat-each=3 apps/demo/e2e/zz-fx1-diag.e2e.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report-${{ matrix.browser }}.json
          FX1_NOSKIP: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            playwright-report-${{ matrix.browser }}.json
            test-results/
          if-no-files-found: warn
      # echo only, never fails the job (Stage 14 turns this into a rule with a known-flaky list)
      - name: e2e tests that passed only on retry
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          f=playwright-report-${{ matrix.browser }}.json
          [ -f "$f" ] || { echo "no JSON report ($f)"; exit 0; }
          jq -r '[.. | objects | select(has("specs")) | .specs[] | . as $s | .tests[] | select(.status == "flaky") | "[\(.projectName)] \($s.file):\($s.line) \($s.title) (passed on retry #\(.results | map(select(.status == "passed")) | .[0].retry))"] | if length == 0 then "none" else .[] end' "$f" || true

  test-slow:
    # Multi-sim-hour drift runs and long clinical scenarios of @pme/engine-core, one file at a time (see
    # packages/engine-core/vite.config.ts SLOW). Kept apart from the main job so their long synchronous stretches
    # cannot starve the Vitest worker RPC there. FU-4 (D17): two file groups, one job each; FU-9 (CI amendment 5): four, by measured time; FU-7 gate: six (FU-7's seven files ≈ 71 min on the runner); CI amendment 6 (FU-10 gate): seven, re-packed to ≈ 33 min each.
    strategy:
      fail-fast: false
      matrix:
        group: [slow-a, slow-b, slow-c, slow-d, slow-e, slow-f, slow-g, showcase]
    name: test-slow (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pme/engine-core test
        if: matrix.group != 'showcase'
        env:
          PME_TEST_SET: ${{ matrix.group }}
      # Stage 11: the showcase cards' scenario tests (apps/demo vite.config.ts); `vitest run` without the package
      # script's --passWithNoTests, so a set that matches no file fails instead of passing empty
      - run: pnpm --filter @pme/demo exec vitest run
        if: matrix.group == 'showcase'
        env:
          PME_TEST_SET: showcase
