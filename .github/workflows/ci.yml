name: ci

on:
  push:
    branches: [main]
    tags: ['v*'] # a release tag (as release.yml): the nightly set only
  pull_request:
  # brief 218 (the owner's ruling of 12 November 2026): the @known-flaky WebKit quarantine runs nightly on main, on a
  # manual dispatch and on a release tag, never on a pull request. Those runs carry ONLY the e2e sets marked 'nightly'
  # in scripts/ci/e2e-sets.mjs (the quarantine) and its count check; every other job skips (`changes.outputs.nightly`).
  schedule:
    - cron: '30 22 * * *' # nightly, 02:00 in the owner's time zone (the soak's hour, validation.yml)
  workflow_dispatch:

# A PR's run of an older head stops when the branch gets a newer push; main's runs never cancel (research/42 §1.4 d1).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A run does the work its change can affect (scripts/ci/affected.mjs, from the workspace's package graph). In words:
  # - EVERY job runs on a push to main, on the nightly, manual and tag runs (their own sets, below), on the merge
  #   runner's batch/* branches, on a pull request labelled run-validation, and on a pull request that changes the engine
  #   (engine-core, skins), the controller's scenario code, a workflow, a script, the lockfile, a root config, or a path
  #   the rule does not place, or an empty diff.
  # - Any other pull request skips only the jobs whose packages it cannot reach: `unit (core)` and the engine's slow
  #   groups. A pull request of documents only runs the docs job alone. Changed files are listed at both paths of a
  #   move (--no-renames), so an engine file moved out of the engine still counts as an engine change.
  # - The label is read when the run starts; added later, it takes effect on the next push.
  # A skipped job reports as skipped. The `verdict` job is the check a merge reads: it fails when a job the plan expected
  # did not succeed or one it left out did not skip.
  # This job also builds the renderer IIFE and the embed every e2e shard loads, and the shard plan they share.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.f.outputs.code }}
      expect: ${{ steps.f.outputs.expect }}
      nightly: ${{ steps.f.outputs.nightly }}
      e2e_matrix: ${{ steps.e2e.outputs.matrix }}
      playwright: ${{ steps.playwright.outputs.version }}
      shard_plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR's merge commit and its base parent
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # nightly: the schedule, a manual dispatch or a tag push run the 'nightly' e2e sets only
          nightly=false; case "$EVENT:${{ github.ref }}" in schedule:*|workflow_dispatch:*|push:refs/tags/*) nightly=true ;; esac
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/files.txt"
          if [ "$EVENT" = pull_request ]; then git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"; cat "$RUNNER_TEMP/files.txt"; fi
          NIGHTLY=$nightly node scripts/ci/affected.mjs plan "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/plan.txt" 2>> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/plan.txt" | tee -a "$GITHUB_OUTPUT"
      # The e2e matrix, one row per shard, from scripts/ci/e2e-sets.mjs: the one place each set's shard count is set (the
      # shard plan and the e2e count read it there too), and which run carries it: 'pr' (PRs, pushes to main) or 'nightly'.
      - id: e2e
        run: |
          m=$(node scripts/ci/e2e-sets.mjs matrix ${{ steps.f.outputs.nightly == 'true' && 'nightly' || 'pr' }}); echo "$m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
      - run: node scripts/ci/markers.mjs # [ENG: kind] / [FIT: target; src | brief] markers and their counts (docs/DESIGN-BRIEF.md)
      # every step of the old one-job validation workflow is in its `validate` or `soak` job, each job's triggers named
      - run: node scripts/ci/validation-steps.mjs
      # The renderer IIFE is built once, here, and shared: the e2e jobs need only it (iife-smoke.html loads it from
      # file://; every other e2e page runs on a Vite dev server from source), so they start without waiting for the unit
      # tests in the build job.
      - uses: pnpm/action-setup@v4
        if: steps.f.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: steps.f.outputs.code == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.f.outputs.code == 'true'
      # The e2e jobs' container tag is the Playwright the lockfile installs, so a Playwright bump moves the image with it
      # (and an unknown version fails at "Initialize containers", not after an hour)
      - name: Playwright version from the lockfile
        id: playwright
        if: steps.f.outputs.code == 'true'
        run: |
          v=$(pnpm exec playwright --version | awk '{print $2}')
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::unexpected Playwright version: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # e2e shards by recorded duration: the latest green run of this workflow on main (a push: a nightly run on main
      # carries only the quarantine's report), whose e2e reports balance the shards (scripts/ci/e2e-shard-plan.mjs). The
      # plan is made here, once, and every e2e shard reads it, so the shards of a set always split the same way (research/41
      # row 64: planned in each shard, one shard's failed download of one report gave it its own split, and 174 WebKit
      # tests ran against 165 listed, run 42284321017). Any failure leaves the plan empty, and every shard uses
      # Playwright's --shard.
      - name: the last green main run (its e2e reports balance the e2e shards)
        id: durations
        if: steps.f.outputs.code == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "last green main run: ${id:-none}"
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4 # every set's reports from that run
        if: steps.f.outputs.code == 'true' && steps.durations.outputs.run != ''
        continue-on-error: true
        timeout-minutes: 3
        with:
          pattern: e2e-report-*
          path: .e2e-main-reports
          run-id: ${{ steps.durations.outputs.run }}
          github-token: ${{ github.token }}
      - name: the e2e shard plan (one per set, read by every shard)
        id: plan
        if: steps.f.outputs.code == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          d=.e2e-main-reports; [ -d "$d" ] || d=none
          plan=$(node scripts/ci/e2e-shard-plan.mjs plan "$d")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter "@pme/renderer^..." build # the renderer's workspace dependencies first (its tsconfig.build.json reads their dist/types)
        if: steps.f.outputs.code == 'true'
      - run: pnpm --filter @pme/renderer build
        if: steps.f.outputs.code == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.f.outputs.code == 'true'
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist/patient-monitor.iife.js
          if-no-files-found: error
      - run: pnpm --filter @pme/demo build # writes apps/demo/dist/embed/ (the file:// ventilator + monitor embed)
        if: steps.f.outputs.code == 'true'
      - uses: actions/upload-artifact@v4 # the file:// ventilator + monitor embed
        if: steps.f.outputs.code == 'true'
        with:
          name: ventilator-monitor-embed
          path: apps/demo/dist/embed/
          if-no-files-found: error

  # Every unit-test file that reads a document (scripts/ci/docs-tests.mjs; packages/validation/test/docs-readers.test.ts
  # keeps that list complete) and the NOTICES and licence checks: whenever a document changed and unit (core) does not
  # run, since build, unit and unit (core) hold every document reader between them. A file under a document path that
  # shipped code imports or reads (docs/showcase/i18n/fa-debrief.json, which the demo bundles, and the reports under
  # docs/validation/) is not a document to the rule but a file of that code's package (affected.mjs, documentOwners).
  docs:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/docs-tests.mjs
      - run: pnpm check-notices
      - run: pnpm check-licences

  # The checks, the builds and @pme/ventilator's unit tests (≈ 9 min) in one job, so the ventilator's tests take no runner
  # of their own.
  build:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).build
    name: build and unit (ventilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: slow groups are disjoint, cover SLOW and are all in the test-slow matrix
        working-directory: packages/engine-core
        run: |
          groups="slow-a slow-b slow-c slow-d slow-e slow-f slow-g slow-h slow-i slow-j slow-k slow-l"
          for g in slow $groups; do PME_TEST_SET=$g pnpm exec vitest list --filesOnly | sort > "$RUNNER_TEMP/$g.txt"; echo "$g: $(wc -l < "$RUNNER_TEMP/$g.txt") files"; done
          for g in $groups; do grep -Eq "^ +lanes: \[.*\b$g\b" ../../.github/workflows/ci.yml || { echo "$g is not in the test-slow matrix"; exit 1; }; done
          cd "$RUNNER_TEMP"
          sort $(printf '%s.txt ' $groups) | uniq -d > both.txt
          if [ -s both.txt ]; then echo "in two slow groups:"; cat both.txt; exit 1; fi
          sort -u $(printf '%s.txt ' $groups) | diff slow.txt -
      - name: the showcase halves are disjoint, are together the showcase set, and are in the showcase job
        working-directory: apps/demo
        run: |
          for g in showcase showcase-a showcase-b; do PME_TEST_SET=$g pnpm exec vitest list --filesOnly | sort > "$RUNNER_TEMP/$g.txt"; echo "$g: $(wc -l < "$RUNNER_TEMP/$g.txt") files"; done
          for g in showcase-a showcase-b; do grep -Eq "lanes\.mjs @pme/demo .*\b$g\b" ../../.github/workflows/ci.yml || { echo "$g is not in the showcase job"; exit 1; }; done
          cd "$RUNNER_TEMP"
          sort showcase-a.txt showcase-b.txt | uniq -d > both.txt
          if [ -s both.txt ]; then echo "in both showcase halves:"; cat both.txt; exit 1; fi
          sort -u showcase-a.txt showcase-b.txt | diff showcase.txt -
      # The other unit tests run in the unit jobs (no dependency order); this job keeps the checks and the ventilator's.
      # The tick benchmark, alone on the runner (the fast set leaves it out): inside `pnpm test` the other suites' load
      # pushed its p50 over 6 ms with the engine unchanged. `vitest run` without --passWithNoTests, so a set that
      # matches no file fails instead of passing empty.
      - name: tick benchmark (alone)
        run: pnpm --filter @pme/validation exec vitest run --reporter=dot
        env:
          PME_TEST_SET: perf
      - name: unit (ventilator)
        run: pnpm --filter @pme/ventilator test
        env:
          PME_TEST_SET: fast
      - run: pnpm build
      - run: pnpm check-notices
      - run: pnpm check-licences # Stage 8b: allow-listed licences; shipped packages named in NOTICES with their LICENSES/ texts
      - run: pnpm check-size # Stage 8b: patient-monitor.iife.js ≤ 400 KB gzipped (BUILD-PLAN Stage 8 acceptance 4); no .wasm
      - run: pnpm pack-smoke "$RUNNER_TEMP/pack-smoke" # Stage 8b: the published shape installs, type-checks, runs and bundles (15–30 s)
      - run: pnpm docs:api # Stage 8b: the TypeDoc reference still builds (25–55 s; output git-ignored, not uploaded)
      # KR-A1: the showcase kit's one-file classroom relay must survive real WebSocket frames on Node 22 (an HTTP-only
      # kit check let every kit from 51a37063 to 56f3761f ship a relay that exited at the first client frame)
      - name: kit classroom relay smoke test
        run: node scripts/showcase/make-bundle.mjs "$RUNNER_TEMP/kit" > "$RUNNER_TEMP/kit-build.log" && node scripts/showcase/check-relay.mjs "$RUNNER_TEMP/kit"

  # The unit tests (the fast set; the slow engine set and the showcase cards are in test-slow and showcase), one job per
  # part, no dependency order: every test runs from source and none needs another package's tests first (research/42
  # §1.2, §1.4 d3). @pme/ventilator's are in the build job. One package at a time inside a part (each Vitest run already
  # uses every core; with pnpm's default of four at once, renderer's real-engine tests timed out at 30 s), and every
  # package runs even after one fails, so each reports its counts. `rest` is every package no other part names (today
  # validation and demo), by exclusion, so a new package is never left out.
  unit:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).unit
    strategy:
      fail-fast: false
      matrix:
        part: [controller, rest]
    name: unit (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PME_TEST_SET: fast
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pme/controller test
        if: matrix.part == 'controller'
      - run: pnpm -r --no-sort --workspace-concurrency=1 --no-bail --filter '!@pme/controller' --filter '!@pme/ventilator' --filter '!@pme/engine-core' --filter '!@pme/renderer' --filter '!@pme/skins' --filter '!@pme/audio' test
        if: matrix.part == 'rest'

  # engine-core, renderer, skins and audio: a job of its own, so a change that reaches none of them skips it.
  unit-core:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).unit_core
    name: unit (core)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PME_TEST_SET: fast
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-sort --workspace-concurrency=1 --no-bail --filter @pme/engine-core --filter @pme/renderer --filter @pme/skins --filter @pme/audio test

  # fix-ci-webkit-3: one e2e job per browser (was one step running both on one 2-vCPU runner, so each browser's
  # wall-clock-sensitive tests ran beside the other's load). Retries stay at 2 (playwright.config.ts, CI).
  # ci-faster: each gating suite runs in shards (Playwright --shard, by file; each e2e server has its own port and
  # each shard is its own machine; WebKit keeps workers: 1 inside its shard). Each shard uploads its own report and runs
  # the retry-only check on it; the verdict job's e2e count proves the shards together ran every test (research/42 §1.4 b). The
  # quarantine stays one job. Three shards then, not four: the shard that got teach2-fit.e2e.ts (≈ 18 min alone) set the
  # floor, which three already reach. That file is now three (teach2-fit-stages, -panes, -strip); Playwright fills a
  # shard with a contiguous run of files by test count, so the three adjacent files still shared one shard. So each
  # shard's files now come from scripts/ci/e2e-shard-plan.mjs: per-file durations from the last green main run's
  # reports of the same set, longest first onto the least-loaded shard; Playwright's --shard when there is no usable
  # report. The plan is made once, in the changes job, and every shard reads it (research/41 row 64). The e2e count
  # job's proof is unchanged (it sums the shard reports, however the files were split).
  # ci-shard4: Chromium in four shards. Balanced by duration, its three still each held ≈ 34 recorded min over two workers,
  # ≈ 17 min of tests plus set-up = 20.3–20.4 min wall; four put each near 13 min of tests. WebKit stays at three (≈ 16.4
  # recorded min each). The matrix is built in the changes job from scripts/ci/e2e-sets.mjs, where each set's shard
  # count is set once; e2e-shard-plan.mjs and e2e-count.mjs read the same count.
  # ci-stabilise (2026-10-24): the jobs run in the official Playwright image, which carries the browsers and their
  # system libraries, so no job runs `playwright install --with-deps` (its apt step stalled up to 40 min on the runner's
  # Ubuntu mirror). The @known-flaky tests run on WebKit in their own non-blocking job, e2e-quarantine (webkit), on the
  # nightly run only since brief 218 (same job, same container, same report steps; scripts/ci/e2e-sets.mjs `runs`); the
  # gating e2e (webkit) job runs every other test; e2e (chromium) runs every test. Both enforce the retry rule
  # (docs/gates/stage-14.md, "The retry rule"; docs/guides/known-deviations.md, "Browser tests that passed only on a
  # retry").
  e2e:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).e2e
    strategy:
      fail-fast: false
      # rows { browser, set, grep, report, shard, of }, one per shard of each set of scripts/ci/e2e-sets.mjs
      matrix: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    name: ${{ matrix.set == 'known-flaky' && 'e2e-quarantine' || 'e2e' }} (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.set == 'known-flaky' }} # the quarantine never fails the run
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      # --ipc=host: Playwright's Docker guidance for Chromium (the default 64 MB /dev/shm crashes it). --ulimit core=0
      # (brief 203): the runner pipes cores to systemd-coredump with no size limit, which held a crashed ≈ 700 MB WebKit
      # web process in its exit for minutes, so its page answered nothing and Playwright never said "Target crashed";
      # without a core, a crash ends the page at once and is reported as one
      options: --ipc=host --ulimit core=0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      # No jq: the report steps below read the JSON with Node (scripts/ci/e2e-report.mjs), which the image has, so
      # nothing is downloaded (the jq download from github.com failed three runs before any test ran; research/42 §1.5)
      - name: browsers come from the image (no download)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"; ls "$PLAYWRIGHT_BROWSERS_PATH"
          pnpm exec playwright --version
      - uses: actions/download-artifact@v4
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist
      - uses: actions/download-artifact@v4 # Stage 8b: the embed for vent-embed.e2e.ts
        with:
          name: ventilator-monitor-embed
          path: apps/demo/dist/embed
      # This shard's files from the run's one plan (the changes job's, balanced by recorded duration; the whole plan is
      # in that job's log), or Playwright's count-based --shard when the plan has none for this set, for every shard alike.
      - name: shard plan (by recorded duration; Playwright's --shard if none)
        id: plan
        env:
          E2E_SHARD_PLAN: ${{ needs.changes.outputs.shard_plan }}
        run: |
          if [ ${{ matrix.of }} -gt 1 ] && node scripts/ci/e2e-shard-plan.mjs pick ${{ matrix.report }} ${{ matrix.shard }} > "$RUNNER_TEMP/shard-files.txt" 2> "$RUNNER_TEMP/plan.txt"; then
            echo "args=--test-list $RUNNER_TEMP/shard-files.txt" >> "$GITHUB_OUTPUT"
            echo "shard ${{ matrix.shard }}/${{ matrix.of }}: $(wc -l < "$RUNNER_TEMP/shard-files.txt") files by recorded duration" >> "$RUNNER_TEMP/plan.txt"
          else
            echo "args=--shard=${{ matrix.shard }}/${{ matrix.of }}" >> "$GITHUB_OUTPUT"
            if [ ${{ matrix.of }} -gt 1 ]; then echo "::warning title=e2e shard plan::no usable duration report: Playwright's --shard=${{ matrix.shard }}/${{ matrix.of }}"; fi
          fi
          touch "$RUNNER_TEMP/plan.txt"; cat "$RUNNER_TEMP/plan.txt"
          [ ${{ matrix.of }} -gt 1 ] || exit 0
          { echo "### e2e shard plan (${{ matrix.report }} ${{ matrix.shard }}/${{ matrix.of }})"; echo; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - id: e2e
        run: pnpm test:e2e --project=${{ matrix.browser }} ${{ matrix.grep }} ${{ steps.plan.outputs.args }} --reporter=list,json
        continue-on-error: ${{ matrix.set == 'known-flaky' }} # quarantine: its results are summarised below instead
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report-${{ matrix.report }}.json
          PME_E2E_LEAK_LOG: e2e-leaks # brief 194: what each test left open (the fixture closes it)
          PME_E2E_PRESS_LOG: e2e-presses # each plain press whose node was taken out before its release, or released elsewhere
      - name: presses that could get no click
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: |
          node scripts/ci/e2e-presses.mjs e2e-presses | tee "$RUNNER_TEMP/presses.txt"
          { echo "### e2e: presses that could get no click"; echo; echo '```'; cat "$RUNNER_TEMP/presses.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Brief 194: the contexts and pages tests left open when they ended, which apps/demo/e2e/evidence.ts then closed
      - name: contexts and pages left open by tests (closed by the e2e fixture)
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: |
          node scripts/ci/e2e-leaks.mjs e2e-leaks | tee "$RUNNER_TEMP/leaks.txt"
          { echo "### e2e: contexts and pages left open by tests"; echo; echo '```'; cat "$RUNNER_TEMP/leaks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        with:
          name: e2e-report-${{ matrix.report }}-${{ matrix.shard }}of${{ matrix.of }}
          # the evidence of failed attempts goes in its own artifact below, so the reports the shard plan and the e2e count
          # download stay as small as before
          path: |
            playwright-report-${{ matrix.report }}.json
            test-results/
            !test-results/**/trace.zip
            !test-results/**/evidence/**
            !test-results/**/test-failed-*.png
          if-no-files-found: warn
      # Brief 194: the evidence of every attempt that failed (a retry that then passed included), for every page and
      # context the test had open: the first attempt's Playwright trace (playwright.config.ts `trace`), a screenshot of
      # each page, and each page's counters and console (apps/demo/e2e/evidence.ts). Nothing is written, so nothing is
      # uploaded, when every attempt passed. The upload may fail (GitHub's "Failed to CreateArtifact"): the step then
      # warns and the job's result stays the tests' own; the counters and consoles are printed to the log instead.
      - name: evidence of failed attempts
        id: evidence
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: |
          n=$(find test-results -path '*/evidence/index.json' 2>/dev/null | wc -l)
          t=$(find test-results -name 'trace.zip' 2>/dev/null | wc -l)
          echo "count=$((n + t))" >> "$GITHUB_OUTPUT"
          [ $((n + t)) -gt 0 ] || { echo "no failed attempt: no evidence"; exit 0; }
          echo "failed attempts with evidence: $n; traces: $t; size: $(du -ch $(find test-results \( -name trace.zip -o -name 'test-failed-*.png' -o -path '*/evidence/*' \) -type f) | tail -1 | cut -f1)"
      - id: evidence_upload
        if: ${{ !cancelled() && steps.evidence.outputs.count != '' && steps.evidence.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: e2e-evidence-${{ matrix.report }}-${{ matrix.shard }}of${{ matrix.of }}
          path: |
            playwright-report-${{ matrix.report }}.json
            test-results/**/trace.zip
            test-results/**/evidence/**
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
      - name: evidence not uploaded - the counters and consoles here instead
        if: ${{ !cancelled() && steps.evidence_upload.outcome == 'failure' }}
        run: |
          echo "::warning title=e2e evidence::the evidence artifact e2e-evidence-${{ matrix.report }}-${{ matrix.shard }}of${{ matrix.of }} could not be uploaded; the counters and consoles of every failed attempt follow in this log (the traces are lost)"
          find test-results -path '*/evidence/*' -type f | sort | while read -r f; do echo "::group::$f"; head -c 65536 "$f"; echo; echo "::endgroup::"; done
      # A set-up step failed and no test ran: say so, as an infrastructure failure, and skip the report checks below (a
      # red job here has no test result; re-running it discards no test outcome).
      - name: no test ran (infrastructure)
        if: ${{ failure() && steps.e2e.outcome == 'skipped' }}
        run: |
          echo "::error title=infrastructure::a set-up step failed before any test ran; this job has no test result (re-run the failed job)"
          exit 1
      # ci-stabilise: the quarantine's own record. Per test: passed first time ("expected"), passed only on a retry
      # ("flaky"), failed every attempt ("unexpected"), skipped. Warnings only; a missing report is an error annotation.
      - name: quarantined @known-flaky tests (WebKit, non-blocking) - pass / retry / fail counts
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' && matrix.set == 'known-flaky' }}
        run: |
          f=playwright-report-${{ matrix.report }}.json
          [ -f "$f" ] || { echo "::error title=e2e quarantine::no e2e JSON report ($f)"; exit 1; }
          node scripts/ci/e2e-report.mjs quarantine "$f" | sort > "$RUNNER_TEMP/q.tsv"
          n() { grep -c "^$1$(printf "\t")" "$RUNNER_TEMP/q.tsv" || true; }
          {
            echo "### e2e-quarantine (webkit): the @known-flaky tests, non-blocking"
            echo
            echo "| passed first time | passed only on a retry | failed all 3 attempts | skipped | total |"
            echo "|---|---|---|---|---|"
            echo "| $(n expected) | $(n flaky) | $(n unexpected) | $(n skipped) | $(wc -l < "$RUNNER_TEMP/q.tsv") |"
            echo
            sed -n -e 's/^flaky\t/- retry: /p' -e 's/^unexpected\t/- **FAILED**: /p' "$RUNNER_TEMP/q.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^\(flaky\|unexpected\)\t/\1: /p' "$RUNNER_TEMP/q.tsv" | while read -r l; do echo "::warning title=e2e quarantine::$l"; done
      # A retry is not a pass: an untagged test that passed only on a retry fails the job on both browsers, except, on
      # WebKit, a retry whose every earlier attempt ended in a browser crash, which is counted and reported apart
      # (scripts/ci/e2e-report.mjs, the crash wordings in scripts/ci/browser-crash.json; docs/gates/stage-14.md, "The
      # retry rule"). A missing or unreadable report fails the job.
      - name: e2e tests that passed only on retry (fails unless tagged @known-flaky or, on WebKit, after a browser crash)
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' && matrix.set != 'known-flaky' }}
        run: |
          f=playwright-report-${{ matrix.browser }}.json
          [ -f "$f" ] || { echo "::error title=e2e JSON report::no e2e JSON report ($f): the retry check cannot run"; exit 1; }
          node scripts/ci/e2e-report.mjs retry "$f" > /dev/null \
            || { echo "::error title=e2e JSON report::$f could not be read: the retry check cannot run"; exit 1; }
          # each line names where its failed attempt's evidence is (the artifact, and the folder inside it)
          case "${{ steps.evidence_upload.outcome }}" in
            success) export E2E_EVIDENCE_WHERE="artifact e2e-evidence-${{ matrix.report }}-${{ matrix.shard }}of${{ matrix.of }}" ;;
            failure) export E2E_EVIDENCE_WHERE="NOT uploaded (the counters and consoles are in this job's log, step \"evidence not uploaded\")" ;;
            *) export E2E_EVIDENCE_WHERE="none kept" ;;
          esac
          node scripts/ci/e2e-report.mjs gate "$f" ${{ matrix.browser }}

  # The showcase cards' scenario tests (apps/demo/vite.config.ts), its two halves at once on one runner, each in its own
  # Vitest process with its files one at a time (scripts/ci/lanes.mjs). `vitest run` without the package script's
  # --passWithNoTests, so a set that matches no file fails instead of passing empty. They run on every code change: they
  # also run @pme/controller and the demo's debrief.
  showcase:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).showcase
    name: showcase (showcase-a, showcase-b)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/lanes.mjs @pme/demo showcase-a showcase-b

  # Multi-sim-hour drift runs and long clinical scenarios of @pme/engine-core (packages/engine-core/vite.config.ts SLOW),
  # kept apart from the unit job so their long synchronous stretches cannot starve the Vitest worker RPC there. Twelve
  # groups of ≈ 16 min of tests each, two at once on one runner, each in its own Vitest process with its files one at a
  # time, as it would run alone (scripts/ci/lanes.mjs). Two groups at once can only slow a test, never pass one that
  # fails alone: every per-tick CPU budget among these files is an upper bound. Run 44081774193, the first with two
  # groups to a runner, logged them 4.5× to 170× under their limits (the "ms per tick" / "µs" lines of each test-slow
  # job). On a pull request they run only when the change reaches engine-core (the changes job).
  test-slow:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect).test_slow
    strategy:
      fail-fast: false
      matrix:
        lanes: ['slow-a slow-b', 'slow-c slow-d', 'slow-e slow-f', 'slow-g slow-h', 'slow-i slow-j', 'slow-k slow-l']
    name: test-slow (${{ matrix.lanes }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/lanes.mjs @pme/engine-core ${{ matrix.lanes }}

  # The check a merge reads. First the e2e count: per set of this run, the summed totals of its shards' reports equal
  # `playwright test --list` on the same tree (scripts/ci/e2e-count.mjs); a PR or main push checks the gating sets, the
  # nightly run the quarantine, and a difference fails either. Then every job against the plan of the changes job
  # (scripts/ci/verdict.mjs): one the plan expected that did not succeed, or one it left out that did not skip, fails.
  # Last, the floor (scripts/ci/floor.mjs, the base commit's copy): from the event, the ref, the head branch, the labels
  # and the changed files alone, a push to main, a batch/* branch, the run-validation label or a change under .github/
  # or scripts/ci/ needs every job to have succeeded, and any code change needs changes, build, unit, e2e and showcase.
  # `always()`: the job runs even in a cancelled run, and then fails on the cancelled jobs, so a cancelled or cut-short
  # run never shows it as success, nor as skipped (which a required check would count as passing). The check to
  # require is `verdict` with the conclusion success.
  verdict:
    needs: [changes, docs, build, unit, unit-core, e2e, showcase, test-slow]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR's merge commit and its base parent: the floor's file list and its base copy
      - uses: pnpm/action-setup@v4
        if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.expect).e2e
      - uses: actions/setup-node@v4
        if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.expect).e2e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.expect).e2e
      - uses: actions/download-artifact@v4
        if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.expect).e2e
        with:
          pattern: e2e-report-*
          path: reports
      - name: e2e count (the shards together ran every test)
        if: needs.changes.result == 'success' && fromJSON(needs.changes.outputs.expect).e2e
        run: node scripts/ci/e2e-count.mjs reports ${{ needs.changes.outputs.nightly == 'true' && 'nightly' || 'pr' }}
      - name: every job against the plan
        if: ${{ always() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECT: ${{ needs.changes.outputs.expect }}
          NIGHTLY: ${{ needs.changes.outputs.nightly }}
        run: node scripts/ci/verdict.mjs
      - name: the floor (independent of the path rule)
        if: ${{ always() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          : > "$RUNNER_TEMP/floor-files.txt"
          if [ "$EVENT" = pull_request ]; then git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/floor-files.txt"; fi
          git show HEAD^1:scripts/ci/floor.mjs > "$RUNNER_TEMP/floor.mjs" 2>/dev/null || cp scripts/ci/floor.mjs "$RUNNER_TEMP/floor.mjs"
          node "$RUNNER_TEMP/floor.mjs" "$RUNNER_TEMP/floor-files.txt"
