name: ci

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: nproc; node -e "console.log(require('os').availableParallelism())"; free -g
      - run: pnpm test
        env:
          PME_TEST_SET: fast # the slow engine set runs in the test-slow job
