name: ci

on:
  push:
    branches: [main]
  pull_request:

# A PR's run of an older head stops when the branch gets a newer push; main's runs never cancel (research/42 §1.4 d1).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the PR changes (research/42 §1.4 a, d2): code at all (if not, the docs job alone runs) and the engine or the
  # root config (if not, the engine's slow groups skip). On main every job runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      engine: ${{ steps.f.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR's merge commit and its base parent
      - id: f
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "engine=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"; cat "$RUNNER_TEMP/files.txt"
          code=false; grep -qvE '^(docs/|[^/]+\.md$|CITATION\.cff$)' "$RUNNER_TEMP/files.txt" && code=true
          engine=false; grep -qE '^(packages/(engine-core|skins)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|tsconfig[^/]*\.json$|vitest\.workspace\.ts$|\.github/workflows/)' "$RUNNER_TEMP/files.txt" && engine=true
          echo "code=$code engine=$engine"
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "engine=$engine" >> "$GITHUB_OUTPUT"

  # Documents-only PRs (docs/, root *.md, CITATION.cff): every unit-test file that reads a document
  # (scripts/ci/docs-tests.mjs; packages/validation/test/docs-readers.test.ts keeps that list complete) and the NOTICES
  # and licence checks, nothing else. No e2e test reads docs/ (research/42 §1.4 a).
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/docs-tests.mjs
      - run: pnpm check-notices
      - run: pnpm check-licences

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: slow groups are disjoint, cover SLOW and are all in the test-slow matrix
        working-directory: packages/engine-core
        run: |
          groups="slow-a slow-b slow-c slow-d slow-e slow-f slow-g slow-h slow-i"
          for g in slow $groups; do PME_TEST_SET=$g pnpm exec vitest list --filesOnly | sort > "$RUNNER_TEMP/$g.txt"; echo "$g: $(wc -l < "$RUNNER_TEMP/$g.txt") files"; done
          for g in $groups; do grep -Eq "^ +group: \[.*\b$g\b" ../../.github/workflows/ci.yml || { echo "$g is not in the test-slow matrix"; exit 1; }; done
          cd "$RUNNER_TEMP"
          sort $(printf '%s.txt ' $groups) | uniq -d > both.txt
          if [ -s both.txt ]; then echo "in two slow groups:"; cat both.txt; exit 1; fi
          sort -u $(printf '%s.txt ' $groups) | diff slow.txt -
      - name: the showcase halves are disjoint, are together the showcase set, and are in the test-slow matrix
        working-directory: apps/demo
        run: |
          for g in showcase showcase-a showcase-b; do PME_TEST_SET=$g pnpm exec vitest list --filesOnly | sort > "$RUNNER_TEMP/$g.txt"; echo "$g: $(wc -l < "$RUNNER_TEMP/$g.txt") files"; done
          for g in showcase-a showcase-b; do grep -Eq "^ +group: \[.*\b$g\b" ../../.github/workflows/ci.yml || { echo "$g is not in the test-slow matrix"; exit 1; }; done
          cd "$RUNNER_TEMP"
          sort showcase-a.txt showcase-b.txt | uniq -d > both.txt
          if [ -s both.txt ]; then echo "in both showcase halves:"; cat both.txt; exit 1; fi
          sort -u showcase-a.txt showcase-b.txt | diff showcase.txt -
      # The unit tests run in the `unit` job (three runners, no dependency order); this job keeps the checks.
      # The tick benchmark, alone on the runner (the fast set leaves it out): inside `pnpm test` the other suites' load
      # pushed its p50 over 6 ms with the engine unchanged. `vitest run` without --passWithNoTests, so a set that
      # matches no file fails instead of passing empty.
      - name: tick benchmark (alone)
        run: pnpm --filter @pme/validation exec vitest run --reporter=dot
        env:
          PME_TEST_SET: perf
      - run: pnpm build
      - run: pnpm check-notices
      - run: pnpm check-licences # Stage 8b: allow-listed licences; shipped packages named in NOTICES with their LICENSES/ texts
      - run: pnpm check-size # Stage 8b: patient-monitor.iife.js ≤ 400 KB gzipped (BUILD-PLAN Stage 8 acceptance 4); no .wasm
      - run: pnpm pack-smoke "$RUNNER_TEMP/pack-smoke" # Stage 8b: the published shape installs, type-checks, runs and bundles (15–30 s)
      - run: pnpm docs:api # Stage 8b: the TypeDoc reference still builds (25–55 s; output git-ignored, not uploaded)
      # KR-A1: the showcase kit's one-file classroom relay must survive real WebSocket frames on Node 22 (an HTTP-only
      # kit check let every kit from 51a37063 to 56f3761f ship a relay that exited at the first client frame)
      - name: kit classroom relay smoke test
        run: node scripts/showcase/make-bundle.mjs "$RUNNER_TEMP/kit" > "$RUNNER_TEMP/kit-build.log" && node scripts/showcase/check-relay.mjs "$RUNNER_TEMP/kit"

  # The unit tests (the fast set; the slow engine set and the showcase cards are in test-slow), in three parallel jobs:
  # `pnpm -r test` ran the packages in dependency order (engine-core → controller → validation → demo, ≈ 31–43 min),
  # though every test runs from source and none needs another package's tests first (research/42 §1.2, §1.4 d3).
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [controller, ventilator, rest]
    name: unit (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PME_TEST_SET: fast
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pme/controller test
        if: matrix.part == 'controller'
      - run: pnpm --filter @pme/ventilator test
        if: matrix.part == 'ventilator'
      # audio, skins, engine-core, renderer, validation, demo: one package at a time (each Vitest run already uses every
      # core; with pnpm's default of four at once, renderer's real-engine tests timed out at 30 s on the first run of
      # this job), in no dependency order, and every package runs even after one fails, so each reports its counts.
      - run: pnpm -r --no-sort --workspace-concurrency=1 --no-bail --filter '!@pme/controller' --filter '!@pme/ventilator' test
        if: matrix.part == 'rest'

  # fix-ci-webkit-3: the renderer IIFE is built once, here, and shared: the e2e jobs need only it (iife-smoke.html loads
  # it from file://; every other e2e page runs on a Vite dev server from source), so they start without waiting for the
  # unit tests in the build job.
  renderer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ci-stabilise: the e2e jobs' container tag is the Playwright the lockfile installs, so a Playwright bump moves
      # the image with it (and an unknown version fails at "Initialize containers", not after an hour)
      - name: Playwright version from the lockfile
        id: playwright
        run: |
          v=$(pnpm exec playwright --version | awk '{print $2}')
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::unexpected Playwright version: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter "@pme/renderer^..." build # Stage 8b: the renderer's workspace dependencies first (its tsconfig.build.json reads their dist/types)
      - run: pnpm --filter @pme/renderer build
      - uses: actions/upload-artifact@v4
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist/patient-monitor.iife.js
          if-no-files-found: error
      - run: pnpm --filter @pme/demo build # Stage 8b: writes apps/demo/dist/embed/ (the file:// ventilator + monitor embed)
      - uses: actions/upload-artifact@v4 # Stage 8b: the file:// ventilator + monitor embed
        with:
          name: ventilator-monitor-embed
          path: apps/demo/dist/embed/
          if-no-files-found: error

  # fix-ci-webkit-3: one e2e job per browser (was one step running both on one 2-vCPU runner, so each browser's
  # wall-clock-sensitive tests ran beside the other's load). Retries stay at 2 (playwright.config.ts, CI).
  # ci-faster: each gating suite runs in three shards (Playwright --shard, by file; every e2e server binds port 0 and
  # each shard is its own machine; WebKit keeps workers: 1 inside its shard). Each shard uploads its own report and runs
  # the retry-only check on it; the e2e-count job proves the shards together ran every test (research/42 §1.4 b). The
  # quarantine stays one job. Three shards, not four: the shard that gets teach2-fit.e2e.ts (≈ 18 min alone) sets the
  # floor, which three already reach.
  # ci-stabilise (2026-10-24): the jobs run in the official Playwright image, which carries the browsers and their
  # system libraries, so no job runs `playwright install --with-deps` (its apt step stalled up to 40 min on the runner's
  # Ubuntu mirror). The @known-flaky tests run on WebKit in their own non-blocking job, e2e-quarantine (webkit); the
  # gating e2e (webkit) job runs every other test; e2e (chromium) runs every test. Both fail on an untagged retry-only
  # pass (docs/gates/stage-14.md, "Temporary relaxation", ended 2026-11-06; docs/guides/known-deviations.md, "Browser
  # tests that passed only on a retry").
  e2e:
    needs: [changes, renderer]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, set: all, grep: '', report: chromium, shard: 1, of: 3 }
          - { browser: chromium, set: all, grep: '', report: chromium, shard: 2, of: 3 }
          - { browser: chromium, set: all, grep: '', report: chromium, shard: 3, of: 3 }
          - { browser: webkit, set: gating, grep: '--grep-invert @known-flaky', report: webkit, shard: 1, of: 3 }
          - { browser: webkit, set: gating, grep: '--grep-invert @known-flaky', report: webkit, shard: 2, of: 3 }
          - { browser: webkit, set: gating, grep: '--grep-invert @known-flaky', report: webkit, shard: 3, of: 3 }
          - { browser: webkit, set: known-flaky, grep: '--grep @known-flaky', report: webkit-known-flaky, shard: 1, of: 1 }
    name: ${{ matrix.set == 'known-flaky' && 'e2e-quarantine' || 'e2e' }} (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.set == 'known-flaky' }} # the quarantine never fails the run
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.renderer.outputs.playwright }}-noble
      options: --ipc=host # Playwright's Docker guidance for Chromium (the default 64 MB /dev/shm crashes it)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      # No jq: the report steps below read the JSON with Node (scripts/ci/e2e-report.mjs), which the image has, so
      # nothing is downloaded (the jq download from github.com failed three runs before any test ran; research/42 §1.5)
      - name: browsers come from the image (no download)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"; ls "$PLAYWRIGHT_BROWSERS_PATH"
          pnpm exec playwright --version
      - uses: actions/download-artifact@v4
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist
      - uses: actions/download-artifact@v4 # Stage 8b: the embed for vent-embed.e2e.ts
        with:
          name: ventilator-monitor-embed
          path: apps/demo/dist/embed
      - id: e2e
        run: pnpm test:e2e --project=${{ matrix.browser }} ${{ matrix.grep }} --shard=${{ matrix.shard }}/${{ matrix.of }} --reporter=list,json
        continue-on-error: ${{ matrix.set == 'known-flaky' }} # quarantine: its results are summarised below instead
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report-${{ matrix.report }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        with:
          name: e2e-report-${{ matrix.report }}-${{ matrix.shard }}of${{ matrix.of }}
          path: |
            playwright-report-${{ matrix.report }}.json
            test-results/
          if-no-files-found: warn
      # A set-up step failed and no test ran: say so, as an infrastructure failure, and skip the report checks below (a
      # red job here has no test result; re-running it discards no test outcome).
      - name: no test ran (infrastructure)
        if: ${{ failure() && steps.e2e.outcome == 'skipped' }}
        run: |
          echo "::error title=infrastructure::a set-up step failed before any test ran; this job has no test result (re-run the failed job)"
          exit 1
      # ci-stabilise: the quarantine's own record. Per test: passed first time ("expected"), passed only on a retry
      # ("flaky"), failed every attempt ("unexpected"), skipped. Warnings only; a missing report is an error annotation.
      - name: quarantined @known-flaky tests (WebKit, non-blocking) - pass / retry / fail counts
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' && matrix.set == 'known-flaky' }}
        run: |
          f=playwright-report-${{ matrix.report }}.json
          [ -f "$f" ] || { echo "::error title=e2e quarantine::no e2e JSON report ($f)"; exit 1; }
          node scripts/ci/e2e-report.mjs quarantine "$f" | sort > "$RUNNER_TEMP/q.tsv"
          n() { grep -c "^$1$(printf "\t")" "$RUNNER_TEMP/q.tsv" || true; }
          {
            echo "### e2e-quarantine (webkit): the @known-flaky tests, non-blocking"
            echo
            echo "| passed first time | passed only on a retry | failed all 3 attempts | skipped | total |"
            echo "|---|---|---|---|---|"
            echo "| $(n expected) | $(n flaky) | $(n unexpected) | $(n skipped) | $(wc -l < "$RUNNER_TEMP/q.tsv") |"
            echo
            sed -n -e 's/^flaky\t/- retry: /p' -e 's/^unexpected\t/- **FAILED**: /p' "$RUNNER_TEMP/q.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^\(flaky\|unexpected\)\t/\1: /p' "$RUNNER_TEMP/q.tsv" | while read -r l; do echo "::warning title=e2e quarantine::$l"; done
      # A retry is not a pass, on both browsers: an untagged test that passed only on a retry fails the job, and a
      # missing or unreadable report fails it too. The WebKit warn-only relaxation (orchestrator ruling 2026-10-18)
      # ended on 2026-11-06, after the stability fixes #268, #265 and #275 merged (docs/gates/stage-14.md,
      # "Temporary relaxation").
      - name: e2e tests that passed only on retry (fails unless the test is tagged @known-flaky)
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' && matrix.set != 'known-flaky' }}
        run: |
          f=playwright-report-${{ matrix.browser }}.json
          [ -f "$f" ] || { echo "::error title=e2e JSON report::no e2e JSON report ($f): the retry check cannot run"; exit 1; }
          node scripts/ci/e2e-report.mjs retry "$f" > "$RUNNER_TEMP/flaky.raw" \
            || { echo "::error title=e2e JSON report::$f could not be read: the retry check cannot run"; exit 1; }
          sort -u "$RUNNER_TEMP/flaky.raw" > "$RUNNER_TEMP/flaky.tsv"
          { echo "### e2e tests that passed only on retry: $(wc -l < "$RUNNER_TEMP/flaky.tsv")"; sed -e 's/^known\t/- (@known-flaky) /' -e 's/^new\t/- **NEW** /' "$RUNNER_TEMP/flaky.tsv"; } >> "$GITHUB_STEP_SUMMARY"
          while IFS="$(printf '\t')" read -r k l; do echo "::warning title=e2e passed only on retry::$l"; done < "$RUNNER_TEMP/flaky.tsv"
          if grep -q '^new' "$RUNNER_TEMP/flaky.tsv"; then
            echo "::error title=e2e passed only on retry::a test without the @known-flaky tag passed only on retry: a retry is not a pass"; exit 1
          fi

  # The shards together ran every test: per set, the summed totals of its shards' reports equal `playwright test --list`
  # on the same tree (scripts/ci/e2e-count.mjs; a gating set that differs fails, the quarantine warns).
  e2e-count:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-*
          path: reports
      - run: node scripts/ci/e2e-count.mjs reports

  test-slow:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Multi-sim-hour drift runs and long clinical scenarios of @pme/engine-core, one file at a time (see
    # packages/engine-core/vite.config.ts SLOW). Kept apart from the main job so their long synchronous stretches
    # cannot starve the Vitest worker RPC there. Nine file groups, one job each, packed on the per-file CI maximum (≤ 33 min of tests each on the slowest runner seen).
    # On a PR the nine engine groups run only when the engine, the skins or the root config change (the changes job;
    # engine-core's only workspace dependency is @pme/skins); main runs them all. The showcase cards, split in two
    # halves (apps/demo/vite.config.ts), run on every code PR: they also run @pme/controller and the demo's debrief.
    strategy:
      fail-fast: false
      matrix:
        group: [slow-a, slow-b, slow-c, slow-d, slow-e, slow-f, slow-g, slow-h, slow-i, showcase-a, showcase-b]
    name: test-slow (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pme/engine-core test
        if: ${{ !startsWith(matrix.group, 'showcase') && needs.changes.outputs.engine == 'true' }}
        env:
          PME_TEST_SET: ${{ matrix.group }}
      # Stage 11: the showcase cards' scenario tests (apps/demo vite.config.ts); `vitest run` without the package
      # script's --passWithNoTests, so a set that matches no file fails instead of passing empty
      - run: pnpm --filter @pme/demo exec vitest run
        if: startsWith(matrix.group, 'showcase')
        env:
          PME_TEST_SET: ${{ matrix.group }}
