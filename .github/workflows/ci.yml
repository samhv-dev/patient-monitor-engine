name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: slow groups are disjoint and cover SLOW (FU-9 CI amendment 5; FU-7 gate adds slow-e and slow-f)
        working-directory: packages/engine-core
        run: |
          for g in slow slow-a slow-b slow-c slow-d slow-e slow-f; do PME_TEST_SET=$g pnpm exec vitest list --filesOnly | sort > "$RUNNER_TEMP/$g.txt"; echo "$g: $(wc -l < "$RUNNER_TEMP/$g.txt") files"; done
          cd "$RUNNER_TEMP"
          sort slow-a.txt slow-b.txt slow-c.txt slow-d.txt slow-e.txt slow-f.txt | uniq -d > both.txt
          if [ -s both.txt ]; then echo "in two slow groups:"; cat both.txt; exit 1; fi
          sort -u slow-a.txt slow-b.txt slow-c.txt slow-d.txt slow-e.txt slow-f.txt | diff slow.txt -
      - run: pnpm test
        env:
          PME_TEST_SET: fast # the slow engine set runs in the test-slow job
      - run: pnpm build
      - run: pnpm check-notices
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: patient-monitor-iife
          path: packages/renderer/dist/patient-monitor.iife.js
          if-no-files-found: error

  test-slow:
    # Multi-sim-hour drift runs and long clinical scenarios of @pme/engine-core, one file at a time (see
    # packages/engine-core/vite.config.ts SLOW). Kept apart from the main job so their long synchronous stretches
    # cannot starve the Vitest worker RPC there. FU-4 (D17): two file groups, one job each; FU-9 (CI amendment 5): four, by measured time; FU-7 gate: six (FU-7's seven files ≈ 71 min on the runner).
    strategy:
      fail-fast: false
      matrix:
        group: [slow-a, slow-b, slow-c, slow-d, slow-e, slow-f]
    name: test-slow (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pme/engine-core test
        env:
          PME_TEST_SET: ${{ matrix.group }}
